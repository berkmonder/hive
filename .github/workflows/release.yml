name: Release

# Push a tag like v0.1.0 → builds macOS (Apple Silicon + Intel), Windows and Linux,
# then creates the GitHub Release with all installers attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-22.04
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # node-gyp (node-pty)

      - name: Install
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes (changes since the previous tag + download table)
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}${GITHUB_REF_NAME} | grep -v -E '^- (docs|chore)' | head -60
            echo
            cat build/release-notes.md
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hive ${{ github.ref_name }}
          body_path: notes.md
          files: installers/*
          draft: false
          prerelease: false
